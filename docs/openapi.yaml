openapi: 3.0.3
info:
  title: 'Order & Payment API Documentation'
  description: 'REST API for managing orders and payments, with pluggable payment gateways, secured with JWT.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Authentication
    description: "\nRegister, log in and manage your JWT. Send the token as `Authorization: Bearer {token}` on every other endpoint.\nLogin and register are limited to 5 requests per minute per IP."
  -
    name: Orders
    description: "\nCreate and manage your orders. You only ever see and change your own orders.\n\nStatus flow: `pending` → `confirmed` or `cancelled`; `confirmed` → `cancelled` (only while unpaid).\nCustomer details and items can only change while the order is `pending`."
  -
    name: Payments
    description: "\nPay for confirmed orders and view payments. Gateways are simulated:\n\n- `credit_card`: a card number ending in `0002` is declined; any other card is approved.\n- `paypal`: an email ending in `@decline.test` is declined; any other email is approved.\n\nEvery payment request needs an `Idempotency-Key` header. Retrying with the same key returns the\noriginal payment (200) and never charges twice."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Get a JWT from <code>POST /api/v1/auth/register</code> or <code>POST /api/v1/auth/login</code>, then send it as <code>Authorization: Bearer {token}</code>.'
security:
  -
    default: []
paths:
  /api/v1/auth/register:
    post:
      summary: Register
      operationId: register
      description: 'Create an account and receive a JWT straight away.'
      parameters: []
      responses:
        201:
          description: Registered
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 201
                  message: 'Registered successfully'
                  data:
                    user:
                      id: 9d8f1e62-3c4b-7a1e-9f2a-6b7c8d9e0f12
                      name: 'Ali Hassan'
                      email: ali@example.com
                      created_at: '2026-10-21T18:32:42.000000Z'
                    token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiI5ZDhmMWU2MiJ9.signature
                    token_type: bearer
                    expires_in: 3600
                properties:
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: 'Registered successfully'
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            example: 9d8f1e62-3c4b-7a1e-9f2a-6b7c8d9e0f12
                          name:
                            type: string
                            example: 'Ali Hassan'
                          email:
                            type: string
                            example: ali@example.com
                          created_at:
                            type: string
                            example: '2026-10-21T18:32:42.000000Z'
                      token:
                        type: string
                        example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiI5ZDhmMWU2MiJ9.signature
                      token_type:
                        type: string
                        example: bearer
                      expires_in:
                        type: integer
                        example: 3600
        422:
          description: 'Validation error'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 422
                  message: 'The email has already been taken.'
                  error:
                    email:
                      - 'The email has already been taken.'
                    password:
                      - 'The password field must contain at least one number.'
                properties:
                  status:
                    type: integer
                    example: 422
                  message:
                    type: string
                    example: 'The email has already been taken.'
                  error:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email has already been taken.'
                        items:
                          type: string
                      password:
                        type: array
                        example:
                          - 'The password field must contain at least one number.'
                        items:
                          type: string
        429:
          description: 'Too many attempts'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 429
                  message: 'Too many requests, please try again later'
                properties:
                  status:
                    type: integer
                    example: 429
                  message:
                    type: string
                    example: 'Too many requests, please try again later'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Full name. Max 255 characters.'
                  example: 'Ali Hassan'
                email:
                  type: string
                  description: 'A unique email address.'
                  example: ali@example.com
                password:
                  type: string
                  description: 'At least 8 characters, with letters and numbers.'
                  example: secret123
                password_confirmation:
                  type: string
                  description: 'Must match `password`.'
                  example: secret123
              required:
                - name
                - email
                - password
                - password_confirmation
      security: []
  /api/v1/auth/login:
    post:
      summary: Login
      operationId: login
      description: 'Exchange email and password for a JWT.'
      parameters: []
      responses:
        200:
          description: 'Logged in'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 200
                  message: 'Logged in successfully'
                  data:
                    user:
                      id: 9d8f1e62-3c4b-7a1e-9f2a-6b7c8d9e0f12
                      name: 'Ali Hassan'
                      email: ali@example.com
                      created_at: '2026-10-21T18:32:42.000000Z'
                    token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiI5ZDhmMWU2MiJ9.signature
                    token_type: bearer
                    expires_in: 3600
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: 'Logged in successfully'
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            example: 9d8f1e62-3c4b-7a1e-9f2a-6b7c8d9e0f12
                          name:
                            type: string
                            example: 'Ali Hassan'
                          email:
                            type: string
                            example: ali@example.com
                          created_at:
                            type: string
                            example: '2026-10-21T18:32:42.000000Z'
                      token:
                        type: string
                        example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiI5ZDhmMWU2MiJ9.signature
                      token_type:
                        type: string
                        example: bearer
                      expires_in:
                        type: integer
                        example: 3600
        401:
          description: 'Wrong email or password'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 401
                  message: 'Invalid email or password'
                properties:
                  status:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: 'Invalid email or password'
        422:
          description: 'Validation error'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 422
                  message: 'The email field is required.'
                  error:
                    email:
                      - 'The email field is required.'
                properties:
                  status:
                    type: integer
                    example: 422
                  message:
                    type: string
                    example: 'The email field is required.'
                  error:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email field is required.'
                        items:
                          type: string
        429:
          description: 'Too many attempts'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 429
                  message: 'Too many requests, please try again later'
                properties:
                  status:
                    type: integer
                    example: 429
                  message:
                    type: string
                    example: 'Too many requests, please try again later'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: ''
                  example: ali@example.com
                password:
                  type: string
                  description: ''
                  example: secret123
              required:
                - email
                - password
      security: []
  /api/v1/auth/refresh:
    post:
      summary: 'Refresh token'
      operationId: refreshToken
      description: "Exchange the current token (even an expired one, inside the refresh window) for a new one.\nThe old token stops working."
      parameters: []
      responses:
        200:
          description: Refreshed
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 200
                  message: 'Token refreshed successfully'
                  data:
                    user:
                      id: 9d8f1e62-3c4b-7a1e-9f2a-6b7c8d9e0f12
                      name: 'Ali Hassan'
                      email: ali@example.com
                      created_at: '2026-10-21T18:32:42.000000Z'
                    token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJuZXcifQ.signature
                    token_type: bearer
                    expires_in: 3600
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: 'Token refreshed successfully'
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            example: 9d8f1e62-3c4b-7a1e-9f2a-6b7c8d9e0f12
                          name:
                            type: string
                            example: 'Ali Hassan'
                          email:
                            type: string
                            example: ali@example.com
                          created_at:
                            type: string
                            example: '2026-10-21T18:32:42.000000Z'
                      token:
                        type: string
                        example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJuZXcifQ.signature
                      token_type:
                        type: string
                        example: bearer
                      expires_in:
                        type: integer
                        example: 3600
        401:
          description: 'Token missing, invalid or already used'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 401
                  message: 'Unauthenticated, please login first'
                properties:
                  status:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: 'Unauthenticated, please login first'
      tags:
        - Authentication
  /api/v1/auth/me:
    get:
      summary: 'Current user'
      operationId: currentUser
      description: 'Return the user who owns the token.'
      parameters: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 200
                  message: Success
                  data:
                    id: 9d8f1e62-3c4b-7a1e-9f2a-6b7c8d9e0f12
                    name: 'Ali Hassan'
                    email: ali@example.com
                    created_at: '2026-10-21T18:32:42.000000Z'
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Success
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 9d8f1e62-3c4b-7a1e-9f2a-6b7c8d9e0f12
                      name:
                        type: string
                        example: 'Ali Hassan'
                      email:
                        type: string
                        example: ali@example.com
                      created_at:
                        type: string
                        example: '2026-10-21T18:32:42.000000Z'
        401:
          description: 'Missing or invalid token'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 401
                  message: 'Unauthenticated, please login first'
                properties:
                  status:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: 'Unauthenticated, please login first'
      tags:
        - Authentication
  /api/v1/auth/logout:
    post:
      summary: Logout
      operationId: logout
      description: 'Invalidate the current token.'
      parameters: []
      responses:
        200:
          description: 'Logged out'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 200
                  message: 'Logged out successfully'
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: 'Logged out successfully'
        401:
          description: 'Missing or invalid token'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 401
                  message: 'Unauthenticated, please login first'
                properties:
                  status:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: 'Unauthenticated, please login first'
      tags:
        - Authentication
  /api/v1/orders:
    get:
      summary: 'List orders'
      operationId: listOrders
      description: 'Your orders, newest first, paginated.'
      parameters:
        -
          in: query
          name: status
          description: 'Filter by status: `pending`, `confirmed` or `cancelled`.'
          example: pending
          required: false
          schema:
            type: string
            description: 'Filter by status: `pending`, `confirmed` or `cancelled`.'
            example: pending
        -
          in: query
          name: page
          description: 'Page number. Defaults to 1.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Page number. Defaults to 1.'
            example: 1
        -
          in: query
          name: per_page
          description: 'Items per page, 1 to 100. Defaults to 15.'
          example: 15
          required: false
          schema:
            type: integer
            description: 'Items per page, 1 to 100. Defaults to 15.'
            example: 15
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 200
                  message: Success
                  data:
                    -
                      id: 01a15fbc-af62-704f-8643-f69b490d1ea9
                      customer_name: 'Ali Hassan'
                      customer_email: ali@example.com
                      customer_phone: '+201001234567'
                      status: pending
                      total: '60.07'
                      items:
                        -
                          id: 01a15fbc-af64-7190-8a65-6e8f95840565
                          product_name: Book
                          quantity: 3
                          price: '19.99'
                          subtotal: '59.97'
                        -
                          id: 01a15fbc-af64-7190-8a65-6e8f95e6e532
                          product_name: Pen
                          quantity: 1
                          price: '0.10'
                          subtotal: '0.10'
                      created_at: '2026-10-21T18:32:42.000000Z'
                      updated_at: '2026-10-21T18:32:42.000000Z'
                  current_page: 1
                  from: 1
                  last_page: 1
                  per_page: 15
                  to: 1
                  total: 1
                  links:
                    first: 'http://localhost:8000/api/v1/orders?page=1'
                    last: 'http://localhost:8000/api/v1/orders?page=1'
                    prev: null
                    next: null
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Success
                  data:
                    type: array
                    example:
                      -
                        id: 01a15fbc-af62-704f-8643-f69b490d1ea9
                        customer_name: 'Ali Hassan'
                        customer_email: ali@example.com
                        customer_phone: '+201001234567'
                        status: pending
                        total: '60.07'
                        items:
                          -
                            id: 01a15fbc-af64-7190-8a65-6e8f95840565
                            product_name: Book
                            quantity: 3
                            price: '19.99'
                            subtotal: '59.97'
                          -
                            id: 01a15fbc-af64-7190-8a65-6e8f95e6e532
                            product_name: Pen
                            quantity: 1
                            price: '0.10'
                            subtotal: '0.10'
                        created_at: '2026-10-21T18:32:42.000000Z'
                        updated_at: '2026-10-21T18:32:42.000000Z'
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 01a15fbc-af62-704f-8643-f69b490d1ea9
                        customer_name:
                          type: string
                          example: 'Ali Hassan'
                        customer_email:
                          type: string
                          example: ali@example.com
                        customer_phone:
                          type: string
                          example: '+201001234567'
                        status:
                          type: string
                          example: pending
                        total:
                          type: string
                          example: '60.07'
                        items:
                          type: array
                          example:
                            -
                              id: 01a15fbc-af64-7190-8a65-6e8f95840565
                              product_name: Book
                              quantity: 3
                              price: '19.99'
                              subtotal: '59.97'
                            -
                              id: 01a15fbc-af64-7190-8a65-6e8f95e6e532
                              product_name: Pen
                              quantity: 1
                              price: '0.10'
                              subtotal: '0.10'
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                example: 01a15fbc-af64-7190-8a65-6e8f95840565
                              product_name:
                                type: string
                                example: Book
                              quantity:
                                type: integer
                                example: 3
                              price:
                                type: string
                                example: '19.99'
                              subtotal:
                                type: string
                                example: '59.97'
                        created_at:
                          type: string
                          example: '2026-10-21T18:32:42.000000Z'
                        updated_at:
                          type: string
                          example: '2026-10-21T18:32:42.000000Z'
                  current_page:
                    type: integer
                    example: 1
                  from:
                    type: integer
                    example: 1
                  last_page:
                    type: integer
                    example: 1
                  per_page:
                    type: integer
                    example: 15
                  to:
                    type: integer
                    example: 1
                  total:
                    type: integer
                    example: 1
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: 'http://localhost:8000/api/v1/orders?page=1'
                      last:
                        type: string
                        example: 'http://localhost:8000/api/v1/orders?page=1'
                      prev:
                        type: string
                        example: null
                        nullable: true
                      next:
                        type: string
                        example: null
                        nullable: true
        401:
          description: 'Missing or invalid token'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 401
                  message: 'Unauthenticated, please login first'
                properties:
                  status:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: 'Unauthenticated, please login first'
        422:
          description: 'Invalid filter'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 422
                  message: 'The selected status is invalid.'
                  error:
                    status:
                      - 'The selected status is invalid.'
                properties:
                  status:
                    type: integer
                    example: 422
                  message:
                    type: string
                    example: 'The selected status is invalid.'
                  error:
                    type: object
                    properties:
                      status:
                        type: array
                        example:
                          - 'The selected status is invalid.'
                        items:
                          type: string
      tags:
        - Orders
    post:
      summary: 'Create an order'
      operationId: createAnOrder
      description: "The order starts as `pending`. Each item's subtotal and the order total are calculated on the server;\na `total` sent by the client is ignored."
      parameters: []
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 201
                  message: 'Created successfully'
                  data:
                    id: 01a15fbc-af62-704f-8643-f69b490d1ea9
                    customer_name: 'Ali Hassan'
                    customer_email: ali@example.com
                    customer_phone: '+201001234567'
                    status: pending
                    total: '59.97'
                    items:
                      -
                        id: 01a15fbc-af64-7190-8a65-6e8f95840565
                        product_name: Book
                        quantity: 3
                        price: '19.99'
                        subtotal: '59.97'
                    created_at: '2026-10-21T18:32:42.000000Z'
                    updated_at: '2026-10-21T18:32:42.000000Z'
                properties:
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: 'Created successfully'
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 01a15fbc-af62-704f-8643-f69b490d1ea9
                      customer_name:
                        type: string
                        example: 'Ali Hassan'
                      customer_email:
                        type: string
                        example: ali@example.com
                      customer_phone:
                        type: string
                        example: '+201001234567'
                      status:
                        type: string
                        example: pending
                      total:
                        type: string
                        example: '59.97'
                      items:
                        type: array
                        example:
                          -
                            id: 01a15fbc-af64-7190-8a65-6e8f95840565
                            product_name: Book
                            quantity: 3
                            price: '19.99'
                            subtotal: '59.97'
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: 01a15fbc-af64-7190-8a65-6e8f95840565
                            product_name:
                              type: string
                              example: Book
                            quantity:
                              type: integer
                              example: 3
                            price:
                              type: string
                              example: '19.99'
                            subtotal:
                              type: string
                              example: '59.97'
                      created_at:
                        type: string
                        example: '2026-10-21T18:32:42.000000Z'
                      updated_at:
                        type: string
                        example: '2026-10-21T18:32:42.000000Z'
        401:
          description: 'Missing or invalid token'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 401
                  message: 'Unauthenticated, please login first'
                properties:
                  status:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: 'Unauthenticated, please login first'
        422:
          description: 'Validation error'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 422
                  message: 'The customer name field is required.'
                  error:
                    customer_name:
                      - 'The customer name field is required.'
                    items.0.quantity:
                      - 'The quantity of item #1 field must be at least 1.'
                    items.0.price:
                      - 'The price of item #1 field must have 0-2 decimal places.'
                properties:
                  status:
                    type: integer
                    example: 422
                  message:
                    type: string
                    example: 'The customer name field is required.'
                  error:
                    type: object
                    properties:
                      customer_name:
                        type: array
                        example:
                          - 'The customer name field is required.'
                        items:
                          type: string
                      items.0.quantity:
                        type: array
                        example:
                          - 'The quantity of item #1 field must be at least 1.'
                        items:
                          type: string
                      items.0.price:
                        type: array
                        example:
                          - 'The price of item #1 field must have 0-2 decimal places.'
                        items:
                          type: string
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_name:
                  type: string
                  description: 'Max 255 characters.'
                  example: 'Ali Hassan'
                customer_email:
                  type: string
                  description: ''
                  example: ali@example.com
                customer_phone:
                  type: string
                  description: 'Optional. Max 30 characters.'
                  example: '+201001234567'
                items:
                  type: array
                  description: '1 to 100 items.'
                  example:
                    - []
                  items:
                    type: object
                    properties:
                      product_name:
                        type: string
                        description: ''
                        example: Book
                      quantity:
                        type: integer
                        description: '1 to 10000.'
                        example: 3
                      price:
                        type: number
                        description: 'Unit price, up to 2 decimal places.'
                        example: 19.99
                    required:
                      - product_name
                      - quantity
                      - price
              required:
                - customer_name
                - customer_email
                - items
  '/api/v1/orders/{id}':
    get:
      summary: 'Show an order'
      operationId: showAnOrder
      description: 'One of your orders, with its items.'
